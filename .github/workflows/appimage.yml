name: Build OpenAstroCC AppImage
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

# Cancel superseded branch/PR builds; tagged releases use their own ref.
concurrency:
  group: appimage-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  appimage:
    name: AppImage x86_64 (Ubuntu 22.04)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and Qt runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libopengl0 xvfb xauth curl \
            libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 \
            libxcb-keysyms1 libxcb-render-util0 libxcb-util1 libxcb-xkb1 \
            libxcb-xinput0 libxcb-xinerama0 libxcb-shape0 libxcb-shm0 \
            libxcb-randr0 libxcb-render0 libxcb-sync1 libxcb-xfixes0 libxcb-glx0
          python -m pip install --upgrade pip
          python -m pip install PyQt6==6.9.1 pyinstaller==6.16.0
      - name: Test hardware-independent code and GUI
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -m unittest discover -s tests -p 'test_*.py' -v
          timeout 120s python tools/check_gui.py
      - name: Build executable AppImage (with license files)
        run: bash scripts/build_appimage.sh
      - name: Smoke-test bundled AppImage (offline; no headset writes)
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/OpenAstroCC-x86_64.AppImage --a50-audio-setup --help
          ./dist/OpenAstroCC-x86_64.AppImage --snapshot evidence/a50-baseline.json --smoke
          test -s dist/OpenAstroCC-x86_64.AppImage
          test -s dist/OpenAstroCC-x86_64.AppImage.sha256
          cd dist && sha256sum -c OpenAstroCC-x86_64.AppImage.sha256
      - name: Smoke-test visible X11 GUI on headless display (no headset)
        shell: bash
        run: |
          # Exercise the real xcb platform plugin, not Qt's offscreen stub.
          # The GUI must stay open and show a disconnected state without USB hardware.
          # timeout=124 is expected: CI terminates an otherwise living window.
          set +e
          APPIMAGE_EXTRACT_AND_RUN=1 QT_QPA_PLATFORM=xcb QT_DEBUG_PLUGINS=1 \
            xvfb-run -a timeout --signal=TERM 12s \
            ./dist/OpenAstroCC-x86_64.AppImage > build/appimage-xcb-smoke.log 2>&1
          status=$?
          set -e
          cat build/appimage-xcb-smoke.log
          test "$status" -eq 124
          test -f dist/AppDir/usr/lib/astro-a50-linux/_internal/libxcb-icccm.so.4
          test -f dist/AppDir/usr/lib/astro-a50-linux/_internal/libxcb-shape.so.0
          test -s dist/AppDir/usr/share/doc/astro-a50-linux/third-party/qt-xcb-system-libraries/libxcb-icccm4.copyright
          test -s dist/AppDir/usr/share/doc/astro-a50-linux/third-party/qt-xcb-system-libraries/libxcb-shape0.copyright
      - name: Upload tested AppImage and SHA256
        uses: actions/upload-artifact@v4
        with:
          name: OpenAstroCC-x86_64
          path: |
            dist/OpenAstroCC-x86_64.AppImage
            dist/OpenAstroCC-x86_64.AppImage.sha256
          if-no-files-found: error

  release:
    name: Publish tagged AppImage release
    needs: appimage
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download tested AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: OpenAstroCC-x86_64
          path: dist
      - name: Verify checksum and semantic version tag
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Expected vMAJOR.MINOR.PATCH[-suffix] tag" >&2; exit 1; }
          cd dist
          sha256sum -c OpenAstroCC-x86_64.AppImage.sha256
      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -e
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; refusing to replace published binaries." >&2
            exit 1
          fi
          extras=()
          # A stable v0.x.y tag is still a regular release. Mark only
          # explicit suffixes (for example v0.2.0-rc1) as pre-releases,
          # so catalogs select newer v0.x.y builds over older releases.
          if [[ "$RELEASE_TAG" == *-* ]]; then extras+=(--prerelease); fi
          gh release create "$RELEASE_TAG" \
            dist/OpenAstroCC-x86_64.AppImage \
            dist/OpenAstroCC-x86_64.AppImage.sha256 \
            --verify-tag \
            --title "OpenAstroCC $RELEASE_TAG" \
            --generate-notes "${extras[@]}"
