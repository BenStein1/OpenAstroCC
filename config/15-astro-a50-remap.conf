# Astro A50 Gen 3 (USB 9886:0015) -- advertise real 5.1/mono channel maps.
#
# Why: WirePlumber's pro-audio profile (see 51-astro-a50-pro-audio.conf) opens
# both A50 USB functions, but ACP labels every channel "AUXn" since the card
# has no UAC channel-position descriptors of its own. A channel map of
# AUX0..AUX5 is not recognised as 5.1 by PulseAudio-introspecting apps/games
# (SDL2, etc.) -- they see 6 generic channels, not FL/FR/FC/LFE/RL/RR, and most
# fall back to stereo. Confirmed live: `pactl list sinks` on
# alsa_output...pro-output-1 showed Channel Map: aux0..aux5 before this fix.
#
# Fix: pipewire-pulse's built-in module-remap-sink/module-remap-source (Pulse
# compat modules, not a new dependency) relabel the channels 1:1 -- no mixing,
# no latency added, same sample data -- and expose a clean named device with a
# real position-based channel map that normal game/app audio backends
# recognise as surround. Verified end-to-end (loaded live via the equivalent
# `pactl load-module` commands with a spaced device.description, which does
# work through a shell -- see artifacts/surround-integration/apply-live.sh):
#   - `pw-link -l`: output.A50_Game_51:output_AUX0..5 are linked straight to
#     alsa_output...pro-output-1:playback_AUX0..5 in order (no channel swap).
#   - SDL2 (both the pulseaudio and native pipewire drivers) enumerates
#     "A50 Game 5.1" and negotiates channels=6 when requesting a 5.1 spec
#     (see artifacts/surround-integration/sdl-*-probe.log). Device was opened
#     paused and never unpaused -- silent, no audible test tone.
#
# device.description below has NO spaces (A50_Game_5.1, not "A50 Game 5.1"):
# this file's `args` string is parsed twice -- once by PipeWire's own config
# reader, once by pipewire-pulse's module-argument splitter -- and a quoted,
# backslash-escaped value that works when typed at a shell (as in
# apply-live.sh) was empirically confirmed NOT to survive that double parse
# unchanged (tested via `pw-config -n pipewire-pulse.conf -r merge pulse.cmd`
# plus a manual reparse of its output: "A50\\ Game\\ 5.1" came out as plain
# "A50", losing the rest). Avoiding the space avoids needing to get that
# escaping right at all.
#
# Also note: this fires when pipewire-pulse itself starts, not when the A50's
# ALSA nodes appear -- if pipewire-pulse starts before the card is enumerated,
# module-remap-sink loads anyway but stays a disconnected, silent stub
# pointing at a nonexistent master (confirmed empirically: a bogus `master=`
# loads without error, just never links to anything). In practice this A50 is
# a wired USB dongle normally already enumerated by the time a user session's
# pipewire-pulse starts, but if the remap sinks are ever seen "stuck" with no
# links, that's the cause -- a logout/login (or wireplumber restart; see the
# node-position rules in 51-astro-a50-pro-audio.conf, which fix this race
# entirely by living in the same component that creates the node) fixes it.
#
# Takes effect next time pipewire-pulse (re)starts/logs in -- this project does
# not restart it. Apply live without a restart with the equivalent `pactl
# load-module ...` commands (see artifacts/surround-integration/apply-live.sh).
#
# Install:
#   mkdir -p ~/.config/pipewire/pipewire-pulse.conf.d
#   cp config/15-astro-a50-remap.conf ~/.config/pipewire/pipewire-pulse.conf.d/
#
# Revert: delete the copied file (+ unload the matching live modules if
# applied via apply-live.sh: `pactl unload-module <id>` for each).
#
# pulse.cmd arrays are appended across conf.d files (PipeWire merges array
# sections), so this does not replace pipewire-pulse's default module list
# (module-always-sink, module-device-manager, etc.).
pulse.cmd = [
  { cmd = "load-module"
    args = "module-remap-sink sink_name=A50_Game_51 sink_properties=device.description=A50_Game_5.1 master=alsa_output.usb-Astro_Gaming_Astro_A50-00.pro-output-1 channels=6 master_channel_map=aux0,aux1,aux2,aux3,aux4,aux5 channel_map=front-left,front-right,front-center,lfe,rear-left,rear-right" }
  { cmd = "load-module"
    args = "module-remap-sink sink_name=A50_Voice sink_properties=device.description=A50_Voice master=alsa_output.usb-Astro_Gaming_Astro_A50-00.pro-output-0 channels=2 master_channel_map=aux0,aux1 channel_map=front-left,front-right" }
  { cmd = "load-module"
    args = "module-remap-source source_name=A50_Mic source_properties=device.description=A50_Mic master=alsa_input.usb-Astro_Gaming_Astro_A50-00.pro-input-0 channels=1 master_channel_map=aux0 channel_map=mono" }
]
