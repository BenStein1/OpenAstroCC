# Astro A50 Gen 3 (USB 9886:0015) — expose BOTH audio functions.
#
# NOT INSTALLED. This file is an artifact; see docs/HARDWARE-TESTS.md test 3.
# Written for WirePlumber 0.5.x (Ben's host: 0.5.10, PipeWire 1.4.7).
#
# Why: the A50 publishes two independent USB audio functions, named by its own
# interface string descriptors as "Astro A50 Game" (6ch 48k out + 2ch aux in)
# and "Astro A50 Voice" (2ch 48k out + 1ch 16k mic). The card exposes no UAC
# mixer controls at all, so WirePlumber's ALSA-card-profile layer falls back to
# generic analog/iec958/ac3 profiles -- and every one of those exposes a single
# sink. With one sink, Game and Voice cannot both be active, and the headset's
# hardware Game/Voice balance control has nothing to balance.
#
# "pro-audio" is the only profile that exposes both (2 sinks, 2 sources) and it
# passes channels through untouched: the headset keeps doing its own mixing. No
# virtual mixer, no monitor loopback, no software sidetone.
#
# Install (Ben's call, not applied by the investigation):
#   mkdir -p ~/.config/wireplumber/wireplumber.conf.d
#   cp config/51-astro-a50-pro-audio.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
#
# Revert: delete the copied file and restart wireplumber. Nothing else is touched.
#
# Expected afterwards (verify, don't assume -- the ordering below is inferred
# from PCM order, hw:1,0 being Voice and hw:1,1 being Game):
#   pro-output-0  -> Voice (2ch)
#   pro-output-1  -> Game  (6ch)
# Confirm with: pactl list sinks short
# If they are swapped, swap the descriptions below; the profile itself is right.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-Astro_Gaming_Astro_A50-00"
      }
    ]
    actions = {
      update-props = {
        # Pin the profile; without this ACP may re-pick a single-sink fallback.
        device.profile = "pro-audio"
        api.acp.auto-profile = false
      }
    }
  }
]
