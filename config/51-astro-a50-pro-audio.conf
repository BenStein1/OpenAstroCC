# Astro A50 Gen 3 (USB 9886:0015) — expose BOTH audio functions with correct
# 5.1/mono channel maps.
#
# INSTALLED (2026-10-24) to ~/.config/wireplumber/wireplumber.conf.d/, but not
# yet active from a WirePlumber (re)start: the profile pin below is live today
# only because a prior `pactl set-card-profile` session command applied it,
# and the node-position rules added 2026-10-24 (see "Why the node rules"
# below) have never been live at all -- this project does not restart
# WirePlumber. Confirm after any future restart with: pactl list sinks short.
# Written for WirePlumber 0.5.x (Ben's host: 0.5.10, PipeWire 1.4.7).
#
# Why: the A50 publishes two independent USB audio functions, named by its own
# interface string descriptors as "Astro A50 Game" (6ch 48k out + 2ch aux in)
# and "Astro A50 Voice" (2ch 48k out + 1ch 16k mic). The card exposes no UAC
# mixer controls at all, so WirePlumber's ALSA-card-profile layer falls back to
# generic analog/iec958/ac3 profiles -- and every one of those exposes a single
# sink. With one sink, Game and Voice cannot both be active, and the headset's
# hardware Game/Voice balance control has nothing to balance.
#
# "pro-audio" is the only profile that exposes both (2 sinks, 2 sources) and it
# passes channels through untouched: the headset keeps doing its own mixing. No
# virtual mixer, no monitor loopback, no software sidetone.
#
# Revert: delete ~/.config/wireplumber/wireplumber.conf.d/51-astro-a50-pro-audio.conf
# and restart wireplumber. Nothing else is touched.
#
# Why the node rules below: pro-audio's ACP layer has no UAC channel-position
# descriptors to work from, so it labels every channel "AUXn". Apps that
# introspect the channel map (SDL2, most games) don't recognise AUX0..AUX5 as
# 5.1 and fall back to stereo. The four node.name rules fix this at node
# creation time -- same component (WirePlumber's own ALSA monitor) that
# creates the node, so no cross-service startup race, unlike a Pulse-side
# module that has to find the node by name after the fact (see
# config/15-astro-a50-remap.conf, today's zero-restart hot fix for the exact
# same problem -- already live via `pactl load-module`, verified with SDL2,
# see README.md/RESUME.md). Once WirePlumber actually restarts with this file
# in place, these raw nodes will already carry the correct channel map and
# the Pulse-side remap sinks in 15-astro-a50-remap.conf become redundant
# (harmless duplicates, not broken) -- worth removing/unloading at that point
# to avoid doubled devices in any device picker.
#
# Expected afterwards -- confirmed via kernel UAC descriptors
# (/proc/asound/card1/stream0, stream1; also tools/a50_audio.py's
# uac_ground_truth(), independent of which profile is active), not just
# inferred from PCM order:
#   hw:1,0 (stream0) = 2ch 48k out (FL FR) + 1ch 16k in (MONO)  -> Voice
#   hw:1,1 (stream1) = 6ch 48k out (FL FR FC LFE RL RR) + 2ch 48k in -> Game
# ALSA/PipeWire's pro-audio profile enumerates pro-output-N/pro-input-N in
# ascending PCM device order, so:
#   pro-output-0 / pro-input-0 -> Voice (2ch out, 1ch mic in)
#   pro-output-1 / pro-input-1 -> Game  (6ch out, 2ch line in)
# Still confirm the live names after switching with: pactl list sinks short
# (profile ordering is a strong, documented convention, not a device-specific
# guarantee) -- but this is no longer a blind guess.
#
# Separately: this host already runs two pre-existing, non-repo pw-loopback
# sinks named A50_Game/A50_Voice (~/.config/systemd/user/a50-loopback-*.service).
# Live tracing (tools/a50_audio.py's trace_virtual_routes(), via `pw-link -l`)
# proves both currently forward into the SAME physical sink
# (alsa_output...iec958-stereo, the current single-sink profile's 2ch output) --
# they are not independent today. Their names are a labeling/EasyEffects-preset
# convenience, not evidence of real Game/Voice separation. Enabling pro-audio
# does not fix this by itself: those two services' --playback-props
# target.object would also need to point at the new pro-output-0/pro-output-1
# sinks respectively for the virtual names to mean what they say. That edit is
# outside this repo and is Ben's call, not performed here.

monitor.alsa.rules = [
  {
    matches = [
      {
        device.name = "alsa_card.usb-Astro_Gaming_Astro_A50-00"
      }
    ]
    actions = {
      update-props = {
        # Pin the profile; without this ACP may re-pick a single-sink fallback.
        device.profile = "pro-audio"
        api.acp.auto-profile = false
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.usb-Astro_Gaming_Astro_A50-00.pro-output-1"
      }
    ]
    actions = {
      update-props = {
        audio.position = [ FL FR FC LFE RL RR ]
        node.description = "A50 Game 5.1"
        node.nick = "A50 Game"
        # Explicit-select only: never outrank the system default sink
        # (Audioengine, priority.session=1500). Without this, ACP's own
        # priority heuristic gives pro-output-1 session=1228 -- below
        # Audioengine today, but close enough to not trust across profile
        # changes. Same convention as this host's easyeffects_sink (session=0).
        priority.session = 0
        priority.driver = 0
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_output.usb-Astro_Gaming_Astro_A50-00.pro-output-0"
      }
    ]
    actions = {
      update-props = {
        audio.position = [ FL FR ]
        node.description = "A50 Voice"
        node.nick = "A50 Voice"
        # ACP gives this port session=1500, a tie with Audioengine -- a tie
        # is not a safe guarantee Audioengine stays default. Force it low.
        priority.session = 0
        priority.driver = 0
      }
    }
  }
  {
    matches = [
      {
        node.name = "alsa_input.usb-Astro_Gaming_Astro_A50-00.pro-input-0"
      }
    ]
    actions = {
      update-props = {
        audio.position = [ MONO ]
        node.description = "A50 Mic"
        node.nick = "A50 Mic"
        # ACP gives this port session=2500 -- higher than the webcam mic's
        # 2009, so it would silently win default-source selection without
        # this override. Confirmed this risk is real: during testing, an
        # unrelated default-node rescan briefly made A50_Mic (missing any
        # priority at all) the default source; caught and reverted, see
        # RESUME.md. Force it low so it can never happen again.
        priority.session = 0
        priority.driver = 0
      }
    }
  }
  {
    # pro-input-1 is the Game interface's stereo line-in, not a microphone --
    # label it so it doesn't masquerade as a selectable mic in a device list.
    matches = [
      {
        node.name = "alsa_input.usb-Astro_Gaming_Astro_A50-00.pro-input-1"
      }
    ]
    actions = {
      update-props = {
        node.description = "A50 Game Line-In (not a mic)"
        node.nick = "A50 Game Line-In"
      }
    }
  }
]
